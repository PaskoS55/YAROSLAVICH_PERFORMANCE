version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: yaroslavich_postgres
    environment:
      POSTGRES_USER: yaroslavich
      POSTGRES_PASSWORD: yaroslavich
      POSTGRES_DB: yaroslavich_performance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yaroslavich"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
