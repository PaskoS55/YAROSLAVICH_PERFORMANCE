version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: pasko_performance_postgres
    environment:
      POSTGRES_USER: pasko_app
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: pasko_performance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pasko_app"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
